<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>

    <!-- Metallic Blue for Ribbon P -->
    <linearGradient id="favRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0a182e"/>
    </linearGradient>

    <!-- Glowing Orange Lightning Bolt -->
    <linearGradient id="favBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="45%" stop-color="#f5821f"/>
      <stop offset="100%" stop-color="#d95400"/>
    </linearGradient>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Badge -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" stroke="#00d2ff" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Icon Emblem (Ribbon P + Lightning + Circuit Traces) -->
  <g transform="translate(6, 4) scale(0.92)">
    <!-- Wafer Grid Arc -->
    <path d="M 54 16 C 28 16 14 38 14 64 C 14 90 30 112 62 112" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 24 44 L 50 44 M 18 60 L 56 60 M 20 76 L 58 76 M 28 92 L 62 92" stroke="#38bdf8" stroke-width="1.4" opacity="0.65"/>
    <path d="M 30 28 L 30 100 M 40 20 L 40 108 M 52 16 L 52 112" stroke="#38bdf8" stroke-width="1.4" opacity="0.65"/>

    <!-- Circuit Branch Traces on Left -->
    <g stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" fill="#38bdf8">
      <path d="M 20 48 L 8 48 L 4 54" fill="none"/>
      <circle cx="4" cy="54" r="3.4"/>
      
      <path d="M 16 64 L 2 64" fill="none"/>
      <circle cx="2" cy="64" r="3.8"/>
      
      <path d="M 18 80 L 8 80 L 4 74" fill="none"/>
      <circle cx="4" cy="74" r="3.4"/>
    </g>

    <!-- 3D P-Ribbon Structure -->
    <path d="M 54 16 C 90 16 116 32 116 58 C 116 82 94 96 68 98 L 56 98 C 46 98 40 104 38 112 L 34 120 C 64 124 106 120 118 92 C 124 74 124 38 90 16 Z" fill="url(#favRibbon)"/>

    <!-- Dynamic Orange Lightning Bolt with Glow -->
    <polygon points="68,14 42,66 64,66 46,118 90,54 66,54 84,14" fill="url(#favBolt)" filter="url(#boltGlow)"/>
    <polygon points="66,18 45,64 64,64 50,110 84,56 66,56 80,18" fill="#fff3a8" opacity="0.85"/>
  </g>
</svg>
